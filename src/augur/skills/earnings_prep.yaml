id: earnings-prep
version: 1.1.0
description: Build a point-in-time pre-earnings research dossier.
license: Apache-2.0
compatibility: ">=11,<12"
inputs_schema:
  required: [ticker]
  optional: [event_id, as_of]
required_capabilities:
  - earnings.collect_evidence
  - personas.analyze
  - runs.compare
  - report.earnings_dossier
permissions:
  resources: [evidence.read, runs.read]
  network_domains: [sec.gov, finance.yahoo.com]
evidence_policy:
  information_time_required: true
  missing: abstain
  min_claim_coverage: 0.95
workflow:
  - id: collect
    uses: earnings.collect_evidence
  - id: analyze
    uses: personas.analyze
    needs: [collect]
  - id: compare
    uses: runs.compare
    needs: [analyze]
  - id: synthesize
    uses: report.earnings_dossier
    needs: [collect, analyze, compare]
outputs_schema:
  required: [run_id, dossier, evidence_manifest]
evals:
  fixtures: [earnings-prep-v1]
  gates: [citation_validity, no_lookahead, missingness_visible]
