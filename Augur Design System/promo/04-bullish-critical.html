<!DOCTYPE html><html class="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../augur.css">
<link rel="stylesheet" href="promo.css">
<script src="pixel.js"></script>
<script src="fit.js"></script>
</head><body class="augur">
<div class="frame">
  <div class="pad">
    <div class="lock">
      <img src="../assets/augur-owl-64.png" width="44" height="44" alt="">
      <span class="w">AUGUR</span>
      <span class="tag">AI Investment Oracle</span>
    </div>

    <div style="margin-top:56px;display:flex;gap:70px;flex:1;align-items:center">
      <!-- score ring + verdict -->
      <div style="display:flex;flex-direction:column;align-items:center;gap:24px;flex-shrink:0">
        <div class="ring" style="--pct:76"><div class="in"><span class="v">7.6</span><span class="l">/ 10</span></div></div>
        <div class="verdict-big buy">BULLISH</div>
      </div>

      <div style="flex:1;max-width:760px">
        <div class="eyebrow">◈ Consensus · NVDA</div>
        <h1 class="h-mega" style="margin-top:18px;font-size:4.4rem">The council<br>calls it.</h1>
        <div style="display:flex;gap:16px;margin-top:30px">
          <span class="chip-px">Confidence 82%</span>
          <span class="chip-px" style="background:linear-gradient(180deg,#ffe9c2,#ffce8a)">Kelly ×9.2%</span>
          <span class="chip-px">13 ▲ · 1 — · 0 ▼</span>
        </div>
      </div>
    </div>

    <!-- DQ combat log -->
    <div class="dq" style="max-width:1120px">
      <div class="who">⚔ Battle Log</div>
      <div style="font-size:1.3rem;line-height:1.7">
        ＊ Augur attacks! &nbsp; ＊ NVDA takes <span style="color:var(--signal-buy)">7.6 BULLISH damage</span>.<br>
        ＊ <span style="color:var(--gilt-bright)">Critical hit!</span> Confidence 82%. &nbsp; ＊ You found 〈<span style="color:var(--gilt-bright)">Kelly Position ×9.2%</span>〉!
      </div>
      <span class="chev">▼</span>
    </div>
  </div>

  <!-- easter eggs: open treasure + coins + sword -->
  <div class="egg" style="right:130px;top:150px;text-align:center"><div data-sprite="chest" data-px="6" class="bob"></div><div class="lbl" style="color:var(--gilt)">loot: +9.2%</div></div>
  <div class="egg" style="right:96px;top:268px"><div data-sprite="coin" data-px="5"></div></div>
  <div class="egg" style="right:210px;top:250px"><div data-sprite="coin" data-px="4"></div></div>
</div>
</body></html>
