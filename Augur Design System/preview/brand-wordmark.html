<!DOCTYPE html><html class="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../augur.css">
<style>html,body{margin:0}body{padding:20px;background:var(--bg-void);width:700px}
.sw{height:46px;border-radius:6px;border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px 8px}
.sw small{font:600 0.58rem/1.2 var(--font-mono);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.row{display:flex;gap:8px}.col{display:flex;flex-direction:column;gap:4px;flex:1}
.cap{font:600 0.6rem/1.3 var(--font-mono);color:var(--fg-2);margin-top:5px}
.lab{font:var(--eyebrow);letter-spacing:1.5px;text-transform:uppercase;color:var(--amber);margin-bottom:10px;display:block}</style>
</head><body class="augur">
<span class="lab">Wordmark · Lockup</span>
<div style="display:flex;flex-direction:column;gap:16px">
  <div style="display:flex;align-items:center;gap:14px"><img src="../assets/augur-owl-64.png" class="pixelated" width="40" height="40"><span style="font:400 1.6rem/1 var(--font-pixel);color:var(--amber);letter-spacing:1px">AUGUR</span></div>
  <div style="display:flex;align-items:center;gap:12px;background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;padding:12px 16px">
    <img src="../assets/augur-owl-64.png" class="pixelated" width="28" height="28"><span style="font:700 1.25rem/1 var(--font-mono);color:var(--amber);letter-spacing:-.5px">Augur</span>
    <span style="font:var(--eyebrow);letter-spacing:1.5px;color:var(--fg-3);text-transform:uppercase;margin-left:auto">AI Investment Oracle</span>
  </div>
  <div style="font:var(--body-sm);color:var(--fg-2)">Pixel wordmark for hero moments · sidebar lockup uses JetBrains Mono &ldquo;Augur&rdquo; for legibility at small sizes.</div>
</div></body></html>
