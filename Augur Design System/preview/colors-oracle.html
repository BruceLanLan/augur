<!DOCTYPE html><html class="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../augur.css">
<style>html,body{margin:0}body{padding:20px;background:var(--bg-void);width:700px}
.sw{height:46px;border-radius:6px;border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px 8px}
.sw small{font:600 0.58rem/1.2 var(--font-mono);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.row{display:flex;gap:8px}.col{display:flex;flex-direction:column;gap:4px;flex:1}
.cap{font:600 0.6rem/1.3 var(--font-mono);color:var(--fg-2);margin-top:5px}
.lab{font:var(--eyebrow);letter-spacing:1.5px;text-transform:uppercase;color:var(--amber);margin-bottom:10px;display:block}</style>
</head><body class="augur">
<span class="lab">Oracle · HD-2D Lore Palette</span>
<div class="row">
  <div class="col"><div class="sw" style="background:#e8dcc0"><small style="color:#2a2118">#e8dcc0</small></div><span class="cap">parchment</span></div>
  <div class="col"><div class="sw" style="background:#d4af37"><small style="color:#2a2118">#d4af37</small></div><span class="cap">gilt</span></div>
  <div class="col"><div class="sw" style="background:#3a2c6e"><small>#3a2c6e</small></div><span class="cap">oracle purple</span></div>
  <div class="col"><div class="sw" style="background:#5cc8ff"><small style="color:#013">#5cc8ff</small></div><span class="cap">crystal</span></div>
  <div class="col"><div class="sw" style="background:#2a2118"><small>#2a2118</small></div><span class="cap">ink</span></div>
</div>
<div style="font:var(--body-sm);color:var(--fg-2);margin-top:10px">Reserved for narrative surfaces — scrolls, dialogue, portraits, relics. Never used for live market data.</div></body></html>
