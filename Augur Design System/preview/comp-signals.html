<!DOCTYPE html><html class="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../augur.css">
<style>html,body{margin:0}body{padding:20px;background:var(--bg-void);width:700px}
.lab{font:var(--eyebrow);letter-spacing:1.5px;text-transform:uppercase;color:var(--amber);margin-bottom:12px;display:block}
.spec{color:var(--fg-3);font:500 0.6rem/1.3 var(--font-mono);margin-top:8px;display:block}</style>
</head><body class="augur">
<span class="lab">Signals · Badges · Verdict · Gauge</span>
<div style="display:flex;gap:10px;align-items:center;margin-bottom:16px">
  <span class="signal-badge buy">▲ BUY</span>
  <span class="signal-badge sell">▼ SELL</span>
  <span class="signal-badge neutral">— HOLD</span>
  <span class="verdict buy" style="margin-left:8px">BULLISH</span>
</div>
<div style="max-width:360px"><div class="gauge"><i style="width:76%"></i></div>
<div style="display:flex;justify-content:space-between;margin-top:5px"><span class="spec" style="margin:0">0</span><span class="spec" style="margin:0;color:var(--amber)">score 7.6</span><span class="spec" style="margin:0">10</span></div></div></body></html>
