<!DOCTYPE html><html class="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../augur.css">
<style>html,body{margin:0}body{padding:20px;background:var(--bg-void);width:700px}
.lab{font:var(--eyebrow);letter-spacing:1.5px;text-transform:uppercase;color:var(--amber);margin-bottom:12px;display:block}
.spec{color:var(--fg-3);font:500 0.6rem/1.3 var(--font-mono);margin-top:8px;display:block}</style>
</head><body class="augur">
<span class="lab">Forms · Field · Chips · Tags</span>
<input class="field mono" placeholder="Enter ticker — e.g. NVDA" style="max-width:340px;margin-bottom:14px">
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
  <span class="tag">⚔ Value</span><span class="tag">🚀 Growth</span><span class="tag">🌐 Macro</span><span class="tag">🇨🇳 China</span>
  <span class="dot live"></span><span class="spec" style="margin:0">live · streaming</span>
</div>
<span class="spec">.field (amber focus ring) · .tag faction chips · .dot.live status</span></body></html>
