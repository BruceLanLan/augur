<!DOCTYPE html><html class="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../augur.css">
<style>html,body{margin:0}body{padding:20px;background:var(--bg-void);width:700px}
.sw{height:46px;border-radius:6px;border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px 8px}
.sw small{font:600 0.58rem/1.2 var(--font-mono);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.row{display:flex;gap:8px}.col{display:flex;flex-direction:column;gap:4px;flex:1}
.cap{font:600 0.6rem/1.3 var(--font-mono);color:var(--fg-2);margin-top:5px}
.lab{font:var(--eyebrow);letter-spacing:1.5px;text-transform:uppercase;color:var(--amber);margin-bottom:10px;display:block}</style>
</head><body class="augur">
<div style="display:flex;align-items:center;gap:24px;background:radial-gradient(120% 100% at 30% 0%,rgba(255,140,0,.08),transparent 60%),var(--bg-panel);border:1px solid var(--border);border-radius:10px;padding:22px 26px">
  <div style="width:96px;height:96px;display:flex;align-items:center;justify-content:center;background:var(--bg-void);border:1px solid var(--border);border-radius:10px;box-shadow:inset 0 0 30px rgba(255,140,0,.06)">
    <img src="../assets/augur-owl-128.png" class="pixelated" width="72" height="72" alt="Augur owl">
  </div>
  <div>
    <span class="lab">Primary Mark</span>
    <div style="font:400 1.5rem/1 var(--font-pixel);color:#fff;letter-spacing:1px">AUGUR</div>
    <div style="font:var(--body-sm);color:var(--fg-2);margin-top:10px;max-width:340px">The white pixel owl — フクロウ, a Japanese omen of fortune &amp; wisdom (&ldquo;不苦労&rdquo;, no hardship). Always crisp-edged, never blurred.</div>
  </div>
</div></body></html>
