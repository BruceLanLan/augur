<!DOCTYPE html><html class="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../augur.css">
<style>html,body{margin:0}body{padding:20px;background:var(--bg-void);width:700px}
.sw{height:46px;border-radius:6px;border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px 8px}
.sw small{font:600 0.58rem/1.2 var(--font-mono);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.row{display:flex;gap:8px}.col{display:flex;flex-direction:column;gap:4px;flex:1}
.cap{font:600 0.6rem/1.3 var(--font-mono);color:var(--fg-2);margin-top:5px}
.lab{font:var(--eyebrow);letter-spacing:1.5px;text-transform:uppercase;color:var(--amber);margin-bottom:10px;display:block}</style>
</head><body class="augur">
<span class="lab">Amber · Terminal Accent</span>
<div class="row">
  <div class="col" style="flex:2"><div class="sw" style="background:#ff8c00"><small style="color:#000">#ff8c00 · amber</small></div><span class="cap">links · focus · primary</span></div>
  <div class="col"><div class="sw" style="background:#ffaa33"><small style="color:#000">#ffaa33</small></div><span class="cap">bright</span></div>
  <div class="col"><div class="sw" style="background:rgba(255,140,0,.15);border-color:var(--border-gilt)"><small style="color:var(--amber)">15% glow</small></div><span class="cap">focus ring</span></div>
  <div class="col"><div class="sw" style="background:rgba(255,140,0,.08);border-color:var(--border)"><small style="color:var(--amber)">8% wash</small></div><span class="cap">tint bg</span></div>
</div></body></html>
