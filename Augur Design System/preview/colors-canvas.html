<!DOCTYPE html><html class="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../augur.css">
<style>html,body{margin:0}body{padding:20px;background:var(--bg-void);width:700px}
.sw{height:46px;border-radius:6px;border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px 8px}
.sw small{font:600 0.58rem/1.2 var(--font-mono);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.row{display:flex;gap:8px}.col{display:flex;flex-direction:column;gap:4px;flex:1}
.cap{font:600 0.6rem/1.3 var(--font-mono);color:var(--fg-2);margin-top:5px}
.lab{font:var(--eyebrow);letter-spacing:1.5px;text-transform:uppercase;color:var(--amber);margin-bottom:10px;display:block}</style>
</head><body class="augur">
<span class="lab">Terminal Canvas · Surfaces</span>
<div class="row">
  <div class="col"><div class="sw" style="background:#0a0a0f"><small>#0a0a0f</small></div><span class="cap">void</span></div>
  <div class="col"><div class="sw" style="background:#10101a"><small>#10101a</small></div><span class="cap">panel</span></div>
  <div class="col"><div class="sw" style="background:#14141f"><small>#14141f</small></div><span class="cap">card</span></div>
  <div class="col"><div class="sw" style="background:#1a1a2a"><small>#1a1a2a</small></div><span class="cap">card-hover</span></div>
  <div class="col"><div class="sw" style="background:#1a1a2e"><small>#1a1a2e</small></div><span class="cap">tertiary</span></div>
  <div class="col"><div class="sw" style="background:#1e1e2e"><small>#1e1e2e</small></div><span class="cap">elevated</span></div>
</div></body></html>
