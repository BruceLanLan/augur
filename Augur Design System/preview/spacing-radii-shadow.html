<!DOCTYPE html><html class="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../augur.css">
<style>html,body{margin:0}body{padding:20px;background:var(--bg-void);width:700px}
.lab{font:var(--eyebrow);letter-spacing:1.5px;text-transform:uppercase;color:var(--amber);margin-bottom:12px;display:block}
.spec{color:var(--fg-3);font:500 0.62rem/1 var(--font-mono)}
.r{display:flex;align-items:baseline;gap:14px;margin-bottom:11px}</style>
</head><body class="augur">
<span class="lab">Radii · Elevation</span>
<div style="display:flex;gap:14px;margin-bottom:18px">
  <div style="text-align:center"><div style="width:80px;height:48px;background:var(--bg-card);border:1px solid var(--border);border-radius:4px"></div><span class="spec">r-sm 4 · cards/btns</span></div>
  <div style="text-align:center"><div style="width:80px;height:48px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px"></div><span class="spec">r-md 8</span></div>
  <div style="text-align:center"><div style="width:80px;height:48px;background:var(--bg-card);border:1px solid var(--border);border-radius:12px"></div><span class="spec">r-lg 12</span></div>
  <div style="text-align:center"><div style="width:80px;height:48px;background:var(--parchment);border:2px solid var(--parchment-ink);border-radius:0"></div><span class="spec">r-pixel 0 · HD-2D</span></div>
</div>
<div style="display:flex;gap:18px">
  <div style="text-align:center"><div style="width:90px;height:46px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.15)"></div><span class="spec">shadow-card</span></div>
  <div style="text-align:center"><div style="width:90px;height:46px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.45)"></div><span class="spec">shadow-pop</span></div>
  <div style="text-align:center"><div style="width:90px;height:46px;background:var(--parchment);border:2px solid #000;box-shadow:4px 4px 0 0 rgba(0,0,0,.55)"></div><span class="spec">shadow-pixel</span></div>
  <div style="text-align:center"><div style="width:90px;height:46px;background:var(--bg-card);border:2px solid var(--gilt);border-radius:6px;box-shadow:0 0 24px rgba(212,175,55,.25)"></div><span class="spec">shadow-gilt</span></div>
</div></body></html>
