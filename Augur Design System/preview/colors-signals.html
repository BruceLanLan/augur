<!DOCTYPE html><html class="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../augur.css">
<style>html,body{margin:0}body{padding:20px;background:var(--bg-void);width:700px}
.sw{height:46px;border-radius:6px;border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px 8px}
.sw small{font:600 0.58rem/1.2 var(--font-mono);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.row{display:flex;gap:8px}.col{display:flex;flex-direction:column;gap:4px;flex:1}
.cap{font:600 0.6rem/1.3 var(--font-mono);color:var(--fg-2);margin-top:5px}
.lab{font:var(--eyebrow);letter-spacing:1.5px;text-transform:uppercase;color:var(--amber);margin-bottom:10px;display:block}</style>
</head><body class="augur">
<span class="lab">Signals · The Tape</span>
<div class="row">
  <div class="col"><div class="sw" style="background:#00c853"><small style="color:#003">#00c853</small></div><span class="cap">BULLISH · buy</span></div>
  <div class="col"><div class="sw" style="background:#ff1744"><small>#ff1744</small></div><span class="cap">BEARISH · sell</span></div>
  <div class="col"><div class="sw" style="background:#ffd600"><small style="color:#330">#ffd600</small></div><span class="cap">NEUTRAL · hold</span></div>
</div>
<div class="row" style="margin-top:8px">
  <div class="col"><div class="sw" style="background:rgba(0,200,83,.15);border-color:rgba(0,200,83,.35)"><small style="color:#00c853">buy 15%</small></div></div>
  <div class="col"><div class="sw" style="background:rgba(255,23,68,.15);border-color:rgba(255,23,68,.35)"><small style="color:#ff1744">sell 15%</small></div></div>
  <div class="col"><div class="sw" style="background:rgba(255,214,0,.12);border-color:rgba(255,214,0,.35)"><small style="color:#ffd600">hold 12%</small></div></div>
</div></body></html>
