<!DOCTYPE html><html class="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../augur.css">
<style>html,body{margin:0}body{padding:20px;background:var(--bg-void);width:700px}
.lab{font:var(--eyebrow);letter-spacing:1.5px;text-transform:uppercase;color:var(--amber);margin-bottom:12px;display:block}
.spec{color:var(--fg-3);font:500 0.6rem/1.3 var(--font-mono);margin-top:8px;display:block}</style>
</head><body class="augur">
<span class="lab">Cards · Stat · Market Tiles</span>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
  <div class="aug-card"><div class="aug-stat"><span class="l">Confidence</span><span class="v">82%</span></div></div>
  <div class="mtile up"><div class="nm">NVDA</div><div class="px">135.20</div><div class="ch">+2.4%</div></div>
  <div class="mtile down"><div class="nm">TSLA</div><div class="px">241.05</div><div class="ch">−1.1%</div></div>
</div>
<span class="spec">aug-card + aug-stat · market tile (left-border tinted by direction, lifts on hover)</span></body></html>
