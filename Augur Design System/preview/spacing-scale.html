<!DOCTYPE html><html class="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../augur.css">
<style>html,body{margin:0}body{padding:20px;background:var(--bg-void);width:700px}
.lab{font:var(--eyebrow);letter-spacing:1.5px;text-transform:uppercase;color:var(--amber);margin-bottom:12px;display:block}
.spec{color:var(--fg-3);font:500 0.62rem/1 var(--font-mono)}
.r{display:flex;align-items:baseline;gap:14px;margin-bottom:11px}</style>
</head><body class="augur">
<span class="lab">Spacing · 4px base grid</span>
<div style="display:flex;flex-direction:column;gap:9px">

<div style="display:flex;align-items:center;gap:12px"><span class="spec" style="width:54px">space-1</span><div style="height:14px;width:4px;background:var(--amber);border-radius:2px"></div><span class="spec">4px</span></div>
<div style="display:flex;align-items:center;gap:12px"><span class="spec" style="width:54px">space-2</span><div style="height:14px;width:8px;background:var(--amber);border-radius:2px"></div><span class="spec">8px</span></div>
<div style="display:flex;align-items:center;gap:12px"><span class="spec" style="width:54px">space-3</span><div style="height:14px;width:12px;background:var(--amber);border-radius:2px"></div><span class="spec">12px</span></div>
<div style="display:flex;align-items:center;gap:12px"><span class="spec" style="width:54px">space-4</span><div style="height:14px;width:16px;background:var(--amber);border-radius:2px"></div><span class="spec">16px</span></div>
<div style="display:flex;align-items:center;gap:12px"><span class="spec" style="width:54px">space-5</span><div style="height:14px;width:24px;background:var(--amber);border-radius:2px"></div><span class="spec">24px</span></div>
<div style="display:flex;align-items:center;gap:12px"><span class="spec" style="width:54px">space-6</span><div style="height:14px;width:32px;background:var(--amber);border-radius:2px"></div><span class="spec">32px</span></div>
<div style="display:flex;align-items:center;gap:12px"><span class="spec" style="width:54px">space-7</span><div style="height:14px;width:48px;background:var(--amber);border-radius:2px"></div><span class="spec">48px</span></div>
<div style="display:flex;align-items:center;gap:12px"><span class="spec" style="width:54px">space-8</span><div style="height:14px;width:64px;background:var(--amber);border-radius:2px"></div><span class="spec">64px</span></div>
</div></body></html>
