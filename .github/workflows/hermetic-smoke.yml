name: Hermetic Smoke

# F0.2 — Hermetic wheel/sdist build, install, and quality gate.
# Every job sets its own ``AUGUR_DATA_DIR`` so there is no cross-job
# contamination and no writes to ``~/.augur``.
#
# Pipeline: build → [test-wheel, test-sdist] (parallel)
# Each test job also runs quality gates (ruff, pip-audit, package-content check).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # ------------------------------------------------------------------
  # Job 1 — Build wheel + sdist, upload as artifact
  # ------------------------------------------------------------------
  build:
    name: Build (wheel + sdist)
    runs-on: ubuntu-latest
    env:
      AUGUR_DATA_DIR: /tmp/augur_build_${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build

      - name: Build wheel + sdist
        run: python3 -m build

      - name: Show artifacts
        run: ls -lh dist/

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ------------------------------------------------------------------
  # Job 2 — Install from wheel in fresh venv + smoke + quality
  # ------------------------------------------------------------------
  test-wheel:
    name: Wheel install smoke (Python 3.12)
    runs-on: ubuntu-latest
    needs: build
    env:
      AUGUR_DATA_DIR: /tmp/augur_smoke_wheel_${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create fresh venv and install from wheel
        run: |
          WHEEL=$(ls dist/*.whl | head -1)
          echo "Installing ${WHEEL}"
          python3 -m venv /tmp/augur_venv_wheel
          /tmp/augur_venv_wheel/bin/pip install "${WHEEL}"

      - name: CLI --help
        run: /tmp/augur_venv_wheel/bin/augur --help

      - name: CLI --version
        run: /tmp/augur_venv_wheel/bin/augur --version

      - name: Schema import check
        run: |
          /tmp/augur_venv_wheel/bin/python3 -c "
          from augur.schemas import EvidenceItem, Claim, RunBundle
          print('import OK')
          "

      - name: Package origin check (must be from site-packages)
        run: |
          IMPORT_PATH=$(/tmp/augur_venv_wheel/bin/python3 -c "import augur; print(augur.__file__)")
          echo "augur.__file__ = ${IMPORT_PATH}"
          case "${IMPORT_PATH}" in
            *site-packages*) echo "OK: wheel installed to site-packages";;
            *) echo "FAIL: not in site-packages — ${IMPORT_PATH}"; exit 1;;
          esac

      - name: Assert no writes to ~/.augur
        run: |
          if [ -d "${HOME}/.augur" ]; then
            echo "FAIL: ~/.augur exists"; find "${HOME}/.augur" -type f; exit 1
          fi
          echo "OK: ~/.augur absent"

      # --- Quality gates (run inside the wheel venv) ---

      - name: Install quality tooling
        run: |
          /tmp/augur_venv_wheel/bin/pip install ruff
          /tmp/augur_venv_wheel/bin/pip install pip-audit 2>/dev/null || echo "pip-audit unavailable, will skip"

      - name: ruff check (lint)
        run: |
          ruff check src/ || {
            echo "FAIL: ruff lint found issues"
            exit 1
          }

      - name: pip-audit (dependency vulnerability scan)
        run: |
          /tmp/augur_venv_wheel/bin/pip-audit --local 2>/dev/null || {
            echo "FAIL: pip-audit found vulnerabilities or is unavailable"
            exit 1
          }

  # ------------------------------------------------------------------
  # Job 3 — Install from sdist in fresh venv + smoke + quality
  # ------------------------------------------------------------------
  test-sdist:
    name: Sdist install smoke (Python 3.12)
    runs-on: ubuntu-latest
    needs: build
    env:
      AUGUR_DATA_DIR: /tmp/augur_smoke_sdist_${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create fresh venv and install from sdist
        run: |
          SDIST=$(ls dist/*.tar.gz | head -1)
          echo "Installing ${SDIST}"
          python3 -m venv /tmp/augur_venv_sdist
          /tmp/augur_venv_sdist/bin/pip install "${SDIST}"

      - name: CLI --help
        run: /tmp/augur_venv_sdist/bin/augur --help

      - name: CLI --version
        run: /tmp/augur_venv_sdist/bin/augur --version

      - name: Schema import check
        run: |
          /tmp/augur_venv_sdist/bin/python3 -c "
          from augur.schemas import EvidenceItem, Claim, RunBundle
          print('import OK')
          "

      - name: Package origin check (must be from site-packages)
        run: |
          IMPORT_PATH=$(/tmp/augur_venv_sdist/bin/python3 -c "import augur; print(augur.__file__)")
          echo "augur.__file__ = ${IMPORT_PATH}"
          case "${IMPORT_PATH}" in
            *site-packages*) echo "OK: sdist installed to site-packages";;
            *) echo "FAIL: not in site-packages — ${IMPORT_PATH}"; exit 1;;
          esac

      - name: Assert no writes to ~/.augur
        run: |
          if [ -d "${HOME}/.augur" ]; then
            echo "FAIL: ~/.augur exists"; find "${HOME}/.augur" -type f; exit 1
          fi
          echo "OK: ~/.augur absent"

      # --- Quality gates (run inside the sdist venv) ---

      - name: Install quality tooling
        run: |
          /tmp/augur_venv_sdist/bin/pip install ruff
          /tmp/augur_venv_sdist/bin/pip install pip-audit 2>/dev/null || echo "pip-audit unavailable, will skip"

      - name: ruff check (lint)
        run: |
          ruff check src/ || {
            echo "FAIL: ruff lint found issues"
            exit 1
          }

      - name: pip-audit (dependency vulnerability scan)
        run: |
          /tmp/augur_venv_sdist/bin/pip-audit --local 2>/dev/null || {
            echo "FAIL: pip-audit found vulnerabilities or is unavailable"
            exit 1
          }
