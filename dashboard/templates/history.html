{% extends "base.html" %}
{% block title %}历史记录 - Augur{% endblock %}
{% block extra_head %}
<style>
.history-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
}
.history-table th {
    text-align: left;
    padding: 10px 12px;
    color: var(--text-muted);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border-color);
}
.history-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border-color);
    font-family: var(--font-data);
}
.history-table tr:hover {
    background: var(--bg-card-hover);
    cursor: pointer;
}
.history-table tr.expanded {
    background: var(--bg-card-hover);
}
.history-table .col-date { white-space: nowrap; }
.history-detail {
    display: none;
    padding: 16px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-color);
}
.history-detail.show { display: table-row; }
.history-detail td { padding: 16px; }
.detail-agents {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 8px;
    margin-top: 12px;
}
.detail-agent-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    font-size: 0.75rem;
}
@media (max-width: 768px) {
    .detail-agents { grid-template-columns: 1fr; }
}
</style>
{% endblock %}
{% block content %}

<header class="page-header mb-16">
    <div class="page-header__text">
        <h1 class="page-title" data-i18n="history-title">历史记录</h1>
        <p class="page-lead" data-i18n="history-desc">查看所有分析历史</p>
    </div>
    <div class="page-actions">
        <button type="button" class="btn btn-sm" onclick="clearAllHistory()" id="clear-btn" style="display:none;" data-i18n="history-clear">清除历史</button>
    </div>
</header>

<div class="card">
    <div id="history-content">
        <div class="empty-state" id="empty-state" style="display:none;">
            <span class="empty-state-icon" aria-hidden="true">&#128340;</span>
            <div class="empty-state-title" data-i18n="history-empty-title">暂无分析历史</div>
            <p class="empty-state-desc" data-i18n="history-empty-desc">运行首次分析后将自动保存在此</p>
            <div class="empty-state-action">
                <a href="/stocks" class="btn btn-primary" style="text-decoration:none;" data-i18n="history-start">开始分析</a>
                <a href="/compare" class="btn btn-sm btn-ghost" style="text-decoration:none;" data-i18n="history-empty-compare">对比分析</a>
            </div>
        </div>
        <!-- Skeleton loading -->
        <div id="history-skeleton" style="display:block;">
            <div class="skeleton-table-row"><div class="skeleton"></div><div class="skeleton" style="width:60%"></div><div class="skeleton" style="width:50px"></div><div class="skeleton" style="width:40px"></div></div>
            <div class="skeleton-table-row"><div class="skeleton"></div><div class="skeleton" style="width:60%"></div><div class="skeleton" style="width:50px"></div><div class="skeleton" style="width:40px"></div></div>
            <div class="skeleton-table-row"><div class="skeleton"></div><div class="skeleton" style="width:60%"></div><div class="skeleton" style="width:50px"></div><div class="skeleton" style="width:40px"></div></div>
            <div class="skeleton-table-row"><div class="skeleton"></div><div class="skeleton" style="width:60%"></div><div class="skeleton" style="width:50px"></div><div class="skeleton" style="width:40px"></div></div>
        </div>
        <!-- Error state -->
        <div id="history-error" class="error-panel" style="display:none;" role="alert">
            <div class="error-panel-title"><span class="error-panel-icon" aria-hidden="true">&#x26A0;</span><span data-i18n="history-error-title">加载失败</span></div>
            <div class="error-panel-msg" id="history-error-msg"></div>
            <div class="error-panel-retry">
                <button type="button" class="btn btn-sm" onclick="loadHistory()" data-i18n="history-error-retry">重试</button>
            </div>
        </div>
        <div class="md-table-wrap">
        <table class="history-table" id="history-table" style="display:none;">
            <caption class="sr-only" data-i18n="history-title">历史记录</caption>
            <thead>
                <tr>
                    <th scope="col" data-i18n="history-col-date">日期</th>
                    <th scope="col" data-i18n="history-col-ticker">股票</th>
                    <th scope="col" data-i18n="history-col-signal">信号</th>
                    <th scope="col" data-i18n="history-col-score">评分</th>
                    <th scope="col" data-i18n="history-col-actions">操作</th>
                </tr>
            </thead>
            <tbody id="history-body"></tbody>
        </table>
        <p class="table-scroll-hint" data-i18n="table-scroll-hint">左右滑动查看完整表格</p>
        </div>
        <!-- Pagination controls -->
        <div id="pagination-controls" style="display:none; padding:12px 0; border-top:1px solid var(--border-color); margin-top:8px;">
            <div class="flex items-center justify-between">
                <button type="button" class="btn btn-sm" id="prev-page-btn" onclick="goToPage(currentPage - 1)" disabled data-i18n="history-prev">上一页</button>
                <span id="page-indicator" class="text-muted text-mono" style="font-size:0.78rem;" aria-live="polite">Page 1 / 1</span>
                <button type="button" class="btn btn-sm" id="next-page-btn" onclick="goToPage(currentPage + 1)" disabled data-i18n="history-next">下一页</button>
            </div>
        </div>
    </div>
</div>

{% endblock %}
{% block extra_scripts %}
<script>
var currentPage = 1;
var totalPages = 1;
var perPage = 20;
function _t(key, fb) { return (typeof window.t === 'function') ? window.t(key, fb) : (fb || key); }

function _historyLocale() {
    return (typeof getCurrentLang === 'function' && getCurrentLang() === 'en') ? 'en-US' : 'zh-CN';
}

function formatHistoryDate(ts) {
    if (!ts) return '--';
    var d = new Date(ts);
    var loc = _historyLocale();
    return window.innerWidth <= 768
        ? d.toLocaleDateString(loc, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
        : d.toLocaleString(loc);
}

function loadHistory() {
    document.getElementById('history-error').style.display = 'none';
    fetch('/api/history?page=' + currentPage + '&per_page=' + perPage)
        .then(function(r) { return r.json(); })
        .then(function(data) {
            document.getElementById('history-skeleton').style.display = 'none';
            var records = data.items || [];
            totalPages = data.pages || 1;
            var total = data.total || 0;

            if (total === 0) {
                document.getElementById('empty-state').style.display = 'block';
                document.getElementById('history-table').style.display = 'none';
                document.getElementById('clear-btn').style.display = 'none';
                document.getElementById('pagination-controls').style.display = 'none';
                return;
            }
            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('history-table').style.display = 'table';
            document.getElementById('history-table').classList.add('fade-in');
            document.getElementById('clear-btn').style.display = 'inline-block';
            renderHistory(records);
            updatePagination();
        })
        .catch(function(err) {
            document.getElementById('history-skeleton').style.display = 'none';
            document.getElementById('history-error').style.display = 'block';
            document.getElementById('history-error-msg').textContent = err.message || _t('history-load-failed');
            showToast(_t('history-load-failed'), 'error');
        });
}

function updatePagination() {
    var controls = document.getElementById('pagination-controls');
    if (totalPages <= 1) {
        controls.style.display = 'none';
        return;
    }
    controls.style.display = 'block';
    document.getElementById('page-indicator').textContent = _t('history-page-indicator', '第 {page} / {total} 页')
        .replace('{page}', currentPage).replace('{total}', totalPages);
    document.getElementById('prev-page-btn').disabled = (currentPage <= 1);
    document.getElementById('next-page-btn').disabled = (currentPage >= totalPages);
}

function goToPage(page) {
    if (page < 1 || page > totalPages) return;
    currentPage = page;
    loadHistory();
}

function signalBadgeClass(s) {
    if (!s) return 'signal-badge-neutral';
    var m = {'bullish':'signal-badge-buy','neutral':'signal-badge-neutral','bearish':'signal-badge-sell'};
    return m[s.toLowerCase()] || 'signal-badge-neutral';
}

function signalLabel(s) {
    var m = {'bullish':'BUY','neutral':'HOLD','bearish':'SELL'};
    return m[(s||'').toLowerCase()] || s;
}

function renderHistory(records) {
    var tbody = document.getElementById('history-body');
    tbody.innerHTML = '';
    records.forEach(function(rec) {
        var tr = document.createElement('tr');
        tr.setAttribute('data-id', rec.id);
        var ts = formatHistoryDate(rec.timestamp);
        tr.innerHTML = '<td class="col-date">' + ts + '</td>' +
            '<td style="font-weight:600; color:var(--accent-orange);">' + escapeHtml(rec.ticker) + '</td>' +
            '<td><span class="signal-badge ' + signalBadgeClass(rec.signal) + '" style="font-size:0.7rem;">' + signalLabel(rec.signal) + '</span></td>' +
            '<td>' + (rec.score || 0).toFixed(1) + '/10</td>' +
            '<td><button class="btn btn-sm btn-ghost" onclick="event.stopPropagation(); deleteRecord(\'' + rec.id + '\', this)">' + escapeHtml(_t('history-delete-btn')) + '</button></td>';
        tr.onclick = function() { toggleDetail(rec.id, tr, rec.ticker); };
        tbody.appendChild(tr);
    });
}

function toggleDetail(id, rowEl, tickerHint) {
    var existing = document.getElementById('detail-' + id);
    if (existing) {
        existing.remove();
        rowEl.classList.remove('expanded');
        return;
    }
    // Remove other open details
    document.querySelectorAll('.history-detail-row').forEach(function(el) { el.remove(); });
    document.querySelectorAll('.history-table tr.expanded').forEach(function(el) { el.classList.remove('expanded'); });

    rowEl.classList.add('expanded');
    fetch('/api/history/' + id)
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (!data || !data.result) return;
            var detailTr = document.createElement('tr');
            detailTr.id = 'detail-' + id;
            detailTr.className = 'history-detail-row';
            var td = document.createElement('td');
            td.colSpan = 5;
            td.style.padding = '16px';
            td.style.background = 'var(--bg-secondary)';

            var agents = data.result.agents || [];
            var ticker = data.ticker || tickerHint || '';
            var html = '<div style="font-size:0.78rem; color:var(--text-secondary); margin-bottom:8px;">' +
                escapeHtml(_t('history-detail-agents').replace('{n}', agents.length)) + '</div>';
            html += '<div class="flex gap-8 mb-12" style="flex-wrap:wrap;">';
            html += '<a href="/stocks?ticker=' + encodeURIComponent(ticker) + '&report=1" class="btn btn-sm btn-primary" style="text-decoration:none;">' +
                escapeHtml(_t('history-view-report')) + '</a>';
            html += '<a href="/compare?ticker=' + encodeURIComponent(ticker) + '" class="btn btn-sm btn-ghost" style="text-decoration:none;">' +
                escapeHtml(_t('history-empty-compare')) + '</a>';
            html += '<a href="/debate?ticker=' + encodeURIComponent(ticker) + '" class="btn btn-sm btn-ghost" style="text-decoration:none;">' +
                escapeHtml(_t('history-debate-link')) + '</a>';
            html += '</div>';
            html += '<div class="detail-agents">';
            agents.forEach(function(a) {
                html += '<div class="detail-agent-card">' +
                    '<div style="font-weight:600;">' + escapeHtml(a.agent_name || a.agent_id) + '</div>' +
                    '<div><span class="signal-badge ' + signalBadgeClass(a.signal) + '" style="font-size:0.65rem;">' + signalLabel(a.signal) + '</span> ' + (a.score||0).toFixed(1) + '/10</div>' +
                    '</div>';
            });
            html += '</div>';
            td.innerHTML = html;
            detailTr.appendChild(td);
            rowEl.parentNode.insertBefore(detailTr, rowEl.nextSibling);
        });
}

function deleteRecord(id, btn) {
    if (!confirm(_t('history-delete-confirm'))) return;
    fetch('/api/history/' + id, { method: 'DELETE' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.status === 'ok') {
                showToast(_t('history-deleted'));
                loadHistory();
            }
        });
}

function clearAllHistory() {
    if (!confirm(_t('history-clear-confirm'))) return;
    fetch('/api/history', { method: 'DELETE' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.status === 'ok') {
                showToast(_t('history-cleared'));
                loadHistory();
            }
        });
}

document.addEventListener('DOMContentLoaded', loadHistory);
</script>
{% endblock %}
