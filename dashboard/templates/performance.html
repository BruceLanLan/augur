{% extends "base.html" %}
{% block title %}绩效追踪 - Augur{% endblock %}
{% block content %}

<h1 style="color:var(--accent-orange); margin-bottom:4px; font-size:1.35rem;" data-i18n="perf-title">绩效追踪</h1>
<p class="text-muted mb-16" style="font-size:0.82rem;" data-i18n="perf-desc">Agent IC (Information Coefficient) 排行榜 - 基于回测数据评估各投资人预测能力</p>

<!-- Leaderboard -->
<div class="card mb-24" style="padding:0; overflow:hidden;">
    <div style="padding:16px 16px 8px; border-bottom:1px solid var(--border-color);">
        <div class="flex items-center justify-between" style="flex-wrap:wrap; gap:8px;">
            <h2 class="data-label" style="margin:0; font-size:inherit;" data-i18n="perf-leaderboard">IC 排行榜</h2>
            <button type="button" class="btn btn-sm" onclick="refreshLeaderboard()" data-i18n="perf-refresh">刷新</button>
        </div>
    </div>
    <div id="leaderboard-content" role="region" aria-live="polite" aria-label="Leaderboard">
        <div style="padding:48px; text-align:center;" role="status">
            <div class="spinner" style="margin:0 auto;" aria-hidden="true"></div>
            <p class="text-muted mt-16" style="font-size:0.82rem;" data-i18n="perf-loading">加载中...</p>
        </div>
    </div>
</div>

<!-- Run Backtest -->
<div class="card">
    <h2 class="data-label mb-12" style="margin:0 0 12px; font-size:inherit;" data-i18n="perf-new-backtest">运行新回测</h2>
    <form class="flex items-center gap-12" style="flex-wrap:wrap;" onsubmit="event.preventDefault(); runBacktest();" aria-label="Run backtest">
        <label for="perf-ticker" class="sr-only">Ticker</label>
        <input id="perf-ticker" type="text" class="form-input" style="max-width:160px; font-family:var(--font-data); text-transform:uppercase;" placeholder="AAPL" value="AAPL" aria-required="true" autocomplete="off">
        <label for="perf-days" class="sr-only">Days</label>
        <select id="perf-days" class="form-select" style="max-width:120px;" aria-label="Backtest period in days">
            <option value="30">30 天</option>
            <option value="60">60 天</option>
            <option value="90">90 天</option>
        </select>
        <button type="submit" class="btn btn-primary" id="run-bt-btn" data-i18n="perf-run">运行回测</button>
    </form>
    <div id="backtest-result" class="mt-16" style="display:none;"></div>
</div>

{% endblock %}
{% block extra_scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    refreshLeaderboard();
});

function refreshLeaderboard() {
    var content = document.getElementById('leaderboard-content');
    content.innerHTML = '<div style="padding:24px; text-align:center;"><div class="spinner" style="margin:0 auto;"></div></div>';

    fetch('/api/backtest/leaderboard')
        .then(function(r) { return r.json(); })
        .then(function(data) {
            renderLeaderboard(data.leaderboard || []);
        })
        .catch(function(err) {
            content.innerHTML = '<div style="padding:24px; text-align:center; color:var(--text-muted);">无数据 - 请先运行回测</div>';
        });
}

function renderLeaderboard(items) {
    var content = document.getElementById('leaderboard-content');
    if (!items || items.length === 0) {
        content.innerHTML = '<div style="padding:48px; text-align:center; color:var(--text-muted);">' +
            '<div style="font-size:2rem; margin-bottom:8px;">&#x1F3C6;</div>' +
            '<div>暂无排行数据</div><div style="font-size:0.78rem; margin-top:4px;">请先运行回测生成 IC 数据</div></div>';
        return;
    }

    var sorted = items.slice().sort(function(a, b) { return (b.ic || 0) - (a.ic || 0); });
    var html = '<table class="data-table"><thead><tr>' +
        '<th style="width:50px;">#</th><th>Agent</th><th class="text-right">IC</th><th class="text-right">准确率</th><th class="text-right">信号数</th>' +
        '</tr></thead><tbody>';

    sorted.forEach(function(item, idx) {
        var rank = idx + 1;
        var rankClass = rank <= 3 ? ' top-3' : '';
        var icColor = (item.ic || 0) > 0 ? 'var(--signal-buy)' : (item.ic || 0) < 0 ? 'var(--signal-sell)' : 'var(--text-muted)';
        html += '<tr>' +
            '<td><span class="leaderboard-rank' + rankClass + '">' + rank + '</span></td>' +
            '<td style="font-weight:600;">' + (item.agent_name || item.agent_id || '--') + '</td>' +
            '<td class="text-right text-mono" style="color:' + icColor + ';">' + (item.ic || 0).toFixed(4) + '</td>' +
            '<td class="text-right text-mono">' + ((item.accuracy || 0) * 100).toFixed(1) + '%</td>' +
            '<td class="text-right text-mono">' + (item.signal_count || 0) + '</td>' +
            '</tr>';
    });

    html += '</tbody></table>';
    content.innerHTML = html;
}

function runBacktest() {
    var ticker = document.getElementById('perf-ticker').value.trim().toUpperCase() || 'AAPL';
    var days = document.getElementById('perf-days').value || 30;
    var btn = document.getElementById('run-bt-btn');
    btn.disabled = true;
    btn.textContent = '运行中...';

    fetch('/api/backtest/run?ticker=' + ticker + '&days=' + days)
        .then(function(r) { return r.json(); })
        .then(function(data) {
            btn.disabled = false;
            btn.textContent = '运行回测';
            showToast('回测完成 - ' + ticker, 'success');
            var result = document.getElementById('backtest-result');
            result.style.display = 'block';
            result.innerHTML = '<div class="card" style="background:var(--bg-primary);">' +
                '<div class="flex items-center gap-24" style="flex-wrap:wrap;">' +
                '<div><span class="data-label">标的</span><div class="text-mono" style="color:var(--accent-orange); font-weight:700;">' + (data.ticker || ticker) + '</div></div>' +
                '<div><span class="data-label">天数</span><div class="text-mono">' + (data.days || days) + '</div></div>' +
                '<div><span class="data-label">共识 IC</span><div class="text-mono" style="color:var(--signal-buy);">' + (data.consensus_ic || 0).toFixed(4) + '</div></div>' +
                '<div><span class="data-label">记录数</span><div class="text-mono">' + (data.total_records || 0) + '</div></div>' +
                '</div></div>';
            // Refresh leaderboard
            refreshLeaderboard();
        })
        .catch(function(err) {
            btn.disabled = false;
            btn.textContent = '运行回测';
            showToast('回测失败: ' + (err.message || err), 'error');
        });
}
</script>
{% endblock %}
