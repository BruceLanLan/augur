{% extends "base.html" %}

{% block title %}500 · Internal server error - Augur{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-card" role="alert" aria-live="polite">
        <img class="error-owl" src="/static/images/augur-owl-128.png" alt="" width="64" height="64" />
        <div class="error-code" aria-label="Error 500">500</div>
        <h1 class="error-heading">Internal server error</h1>
        <p class="error-message">Something broke on our end. We've logged the issue.</p>
        <p class="error-suggestion">Try again in a moment, or head back to the dashboard.</p>
        <div class="error-actions">
            <a class="error-btn error-btn-primary" href="/">← Back to Dashboard</a>
            <button class="error-btn error-btn-secondary" onclick="history.length > 1 ? history.back() : (window.location.href = '/')">
                Go Back
            </button>
        </div>
    </div>
</div>
{% endblock %}
