{% extends "base.html" %}

{% block title %}Login - Augur{% endblock %}

{% block content %}
<div class="page-header">
    <h1 data-i18n="login-title">登录</h1>
    <p class="page-desc" data-i18n="login-desc">登录以访问 Augur 仪表盘</p>
</div>

<div style="max-width: 400px; margin: 2rem auto; padding: 2rem; background: var(--bg-secondary, #1e1e2e); border-radius: 12px; border: 1px solid var(--border-color, #333); width: 90%;">
    <form id="login-form" onsubmit="handleLogin(event)" aria-labelledby="login-title">
        <div style="margin-bottom: 1.5rem;">
            <label for="username" style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-primary, #e0e0e0);" data-i18n="login-username">用户名</label>
            <input type="text" id="username" name="username" required
                   style="width: 100%; padding: 0.75rem; background: var(--bg-primary, #121212); border: 1px solid var(--border-color, #444); border-radius: 8px; color: var(--text-primary, #e0e0e0); font-size: 1rem; box-sizing: border-box;"
                   placeholder="Enter your username" autocomplete="username" maxlength="32" aria-required="true">
        </div>
        <div style="margin-bottom: 1.5rem;">
            <label for="password" style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-primary, #e0e0e0);" data-i18n="login-password">密码</label>
            <input type="password" id="password" name="password" required
                   style="width: 100%; padding: 0.75rem; background: var(--bg-primary, #121212); border: 1px solid var(--border-color, #444); border-radius: 8px; color: var(--text-primary, #e0e0e0); font-size: 1rem; box-sizing: border-box;"
                   placeholder="Enter your password" autocomplete="current-password" maxlength="128" aria-required="true">
        </div>
        <div id="login-error" style="display: none; margin-bottom: 1rem; padding: 0.75rem; background: rgba(255,59,48,0.1); border: 1px solid rgba(255,59,48,0.3); border-radius: 8px; color: #ff6b6b; font-size: 0.9rem;" role="alert"></div>
        <button type="submit" id="login-submit-btn" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem;" data-i18n="login-submit">
            登录
        </button>
    </form>
    <p style="margin-top: 1.5rem; text-align: center; color: var(--text-secondary, #999); font-size: 0.9rem;">
        <span data-i18n="login-register-link">还没有账号？</span> <a href="/register" style="color: var(--accent-orange);">Register</a>
    </p>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
async function handleLogin(event) {
    event.preventDefault();
    var errorEl = document.getElementById('login-error');
    var submitBtn = document.getElementById('login-submit-btn');
    errorEl.style.display = 'none';

    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value;

    if (!username || !password) {
        errorEl.textContent = 'Please fill in all fields.';
        errorEl.style.display = 'block';
        return;
    }

    var origLabel = submitBtn ? submitBtn.textContent : '';
    if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.classList.add('is-loading');
        submitBtn.textContent = (typeof window.t === 'function' ? window.t('login-signing-in') : 'Signing in…');
    }

    try {
        var resp = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: username, password: password})
        });
        var data = await resp.json();
        if (resp.ok && data.token) {
            localStorage.setItem('augur-token', data.token);
            localStorage.setItem('augur-user', data.username);
            window.location.href = '/';
        } else {
            errorEl.textContent = data.detail || 'Login failed. Please check your credentials.';
            errorEl.style.display = 'block';
            if (submitBtn) { submitBtn.disabled = false; submitBtn.classList.remove('is-loading'); submitBtn.textContent = origLabel; }
        }
    } catch(e) {
        errorEl.textContent = 'Connection error. Please try again.';
        errorEl.style.display = 'block';
        if (submitBtn) { submitBtn.disabled = false; submitBtn.classList.remove('is-loading'); submitBtn.textContent = origLabel; }
    }
}
</script>
{% endblock %}
