[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "augur-agents"
version = "10.16.8"
description = "Multi-agent investment analysis system with 18 investor persona agents, consensus mechanism, and multi-platform deployment"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["investment", "multi-agent", "stock-analysis", "ai", "personas", "consensus"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "jinja2>=3.1.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
data = [
    "yfinance>=0.2",
    "pandas>=1.3",
    "requests>=2.28",
]
mcp = [
    "mcp>=1.0.0; python_version>='3.10'",
    "fastmcp>=0.1; python_version>='3.10'",
]
llm = [
    "anthropic>=0.20",
    "openai>=1.0",
]
telegram = [
    "python-telegram-bot>=20.0",
]
slack = [
    "slack-bolt>=1.18",
    "slack-sdk>=3.19",
]
wechat = [
    "gewechat-client>=0.1.0",
    "requests>=2.28.0",
]
lark = [
    "lark-oapi>=1.0",
]
cron = [
    "apscheduler>=3.10.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.24",
    "beautifulsoup4>=4.11",
]
all = [
    "augur-agents[data,mcp,llm,telegram,slack,lark,wechat,cron]",
]

[project.scripts]
augur = "augur.cli:main"
augur-mcp = "augur.mcp_server:run_server"

[project.urls]
Homepage = "https://github.com/BruceLanLan/augur"
Repository = "https://github.com/BruceLanLan/augur"
Documentation = "https://github.com/BruceLanLan/augur#readme"
Issues = "https://github.com/BruceLanLan/augur/issues"
Changelog = "https://github.com/BruceLanLan/augur/blob/main/README.md#-changelog"

[project.entry-points."mcp.server"]
augur-agents = "augur.mcp_server:create_server"

[project.entry-points."augur.plugins"]
# Plugin group; see src/augur/plugins.py (PluginManager.ENTRY_POINT_GROUP).
# Example external plugin registration:
#   my_plugin = "my_pkg.module:MyPlugin"


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
augur = ["py.typed"]
