[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "augur-agents"
version = "11.0.0rc1"
description = "Multi-agent investment analysis system with 18 investor persona agents, consensus mechanism, and multi-platform deployment"
readme = "README.md"
authors = [{ name = "BruceLanLan" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["investment", "multi-agent", "stock-analysis", "ai", "personas", "consensus"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "jinja2>=3.1.0",
    "httpx>=0.24.0",
    "pydantic>=2.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
data = [
    "yfinance>=0.2",
    "pandas>=1.3",
    "requests>=2.28",
]
mcp = [
    # create_server() supports both mcp 1.x (FastMCP) and 2.x (MCPServer);
    # CI exercises the resolved latest, tests/test_mcp_*.py cover both.
    "mcp>=1.0.0,<3; python_version>='3.10'",
]
llm = [
    "anthropic>=0.20",
    "openai>=1.0",
    "beautifulsoup4>=4.11",
]
telegram = [
    "python-telegram-bot>=20.0",
]
slack = [
    "slack-bolt>=1.18",
    "slack-sdk>=3.19",
]
wechat = [
    "gewechat-client>=0.1.0",
    "requests>=2.28.0",
]
lark = [
    "lark-oapi>=1.0",
]
cron = [
    "apscheduler>=3.10.0",
]
export = [
    "markdown>=3.4",
    "weasyprint>=60.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.24",
    "beautifulsoup4>=4.11",
    "setuptools>=77.0",
]
all = [
    "augur-agents[data,mcp,llm,telegram,slack,lark,wechat,cron]",
]

[project.scripts]
augur = "augur.cli:main"
augur-mcp = "augur.mcp_server:run_server"

[project.urls]
Homepage = "https://github.com/BruceLanLan/augur"
Repository = "https://github.com/BruceLanLan/augur"
Documentation = "https://github.com/BruceLanLan/augur#readme"
Issues = "https://github.com/BruceLanLan/augur/issues"
Changelog = "https://github.com/BruceLanLan/augur/blob/main/CHANGELOG.md"

[project.entry-points."mcp.server"]
augur-agents = "augur.mcp_server:create_server"

[project.entry-points."augur.plugins"]
# Plugin group; see src/augur/plugins.py (PluginManager.ENTRY_POINT_GROUP).
# Example external plugin registration:
#   my_plugin = "my_pkg.module:MyPlugin"


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
augur = ["py.typed", "skills/*.yaml"]
dashboard = ["templates/*.html", "static/**/*", "i18n/*.json"]
skills = ["*.md", "**/*.md", "**/*.json"]

[tool.ruff.lint]
# Pin the rule set explicitly: ruff >=0.16 widened its defaults, which turned
# a clean tree into ~2.5k findings (FA100/UP006/BLE001...) without any code
# change. E4/E7/E9/F is the historical default this codebase was linted against.
select = ["E4", "E7", "E9", "F"]
# E402 (module-import-not-at-top-of-file) is intentional here: cli.py registers
# command modules after defining the `cli` group, and several modules defer
# optional/heavy imports (fastapi, slack, wechat, edgar) behind availability
# guards. Moving these to the top would reintroduce import cycles.
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
# dashboard/app.py is a re-export facade: routes/tests import rate-limit and
# i18n helpers from it (and patch names via string paths like
# `patch("dashboard.app.json.loads")`), so its imports look "unused" locally.
"src/dashboard/app.py" = ["F401"]
